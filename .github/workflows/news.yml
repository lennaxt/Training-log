name: Schlagzeilen holen

on:
  schedule:
    # Nicht zur vollen Stunde: da draengen sich die Laeufe aller Repos.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_news.py
      - name: Committen, wenn sich etwas geändert hat
        run: |
          if [ -z "$(git status --porcelain news.json)" ]; then
            echo "Keine neuen Schlagzeilen."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Schlagzeilen aktualisiert"
          git push
