<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon-Auswahl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#343330;--ink-soft:#7A7871;--line:rgba(52,51,48,0.12);--paper:#FFFFFF;--paper-2:#FBF4EA}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
  .wrap{max-width:600px;margin:0 auto;padding:40px 24px 80px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-0.01em}
  .sub{font-size:14px;color:var(--ink-soft);margin-top:8px;margin-bottom:36px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:44px}
  .card{background:var(--paper-2);border:1.5px solid transparent;border-radius:16px;padding:30px 12px 20px;
    display:flex;flex-direction:column;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
  .card:active{transform:scale(0.97)}
  .card.sel{border-color:var(--ink)}
  .card svg{color:var(--ink);display:block}
  .card .nm{font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft)}
  .card.sel .nm{color:var(--ink)}
  .size-row{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:22px}
  .size-row svg{color:var(--ink)}
  .size-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;min-width:56px}
  .note{font-size:13px;color:var(--ink-soft);margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Icon-Auswahl</h1>
  <p class="sub">Gefüllte Icons im Material-Stil (wie dein Referenzbild) — alle sauber und erkennbar. Klick markiert deinen Favoriten.</p>

  <div class="grid">

      <span class="nm">Kraft</span>
    </div>

    <div class="card" data-id="rad">

    <div class="card" data-id="yoga">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="4.4" r="2"/><path d="M12 7c-1 0-1.8.8-1.8 1.8 0 .8.5 1.4 1.2 1.7-.9.2-1.7.6-2.5 1.2L4.4 9.9c-.5-.3-1.2-.1-1.5.4-.3.5-.1 1.2.4 1.5l3.5 2c-.5.9-.8 1.9-.8 3 0 .5.4.9.9.9h10.2c.5 0 .9-.4.9-.9 0-1.1-.3-2.1-.8-3l3.5-2c.5-.3.7-1 .4-1.5-.3-.5-1-.7-1.5-.4l-4.5 2.6c-.8-.6-1.6-1-2.5-1.2.7-.3 1.2-.9 1.2-1.7 0-1-.8-1.8-1.8-1.8z"/></svg>
      <span class="nm">Yoga</span>
    </div>

    <div class="card" data-id="hiit">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="3.8" r="1.9"/><path d="M12 5.7c-.6 0-1.1.5-1.1 1.1v1.3c0 .5-.4.9-.8 1l-2.5.7c-.6.2-1 .8-.8 1.4.1.5.6.9 1.1.9h.2l2-.6v1.7l-2.4 2.3c-.5.4-.5 1.2 0 1.6.2.2.5.3.8.3s.6-.1.8-.3l2.1-2 2.1 2c.5.4 1.2.4 1.6 0 .4-.5.4-1.2 0-1.6l-2.4-2.3v-1.7l2 .6h.2c.5 0 1-.3 1.1-.9.2-.6-.2-1.2-.8-1.4l-2.5-.7c-.4-.1-.8-.5-.8-1v-1.3c0-.6-.5-1.1-1.1-1.1z"/><path d="M9.3 11.4 7.2 10c-.5-.3-1.2-.2-1.5.3-.3.5-.2 1.2.3 1.5l2.1 1.4.6-.7zM14.7 11.4l2.1-1.4c.5-.3 1.2-.2 1.5.3.3.5.2 1.2-.3 1.5l-2.1 1.4-.6-.7z"/></svg>
      <span class="nm">HIIT</span>
    </div>
  </div>

  <div class="size-row">
    <span class="size-label">18px</span>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="16.3" cy="4.2" r="1.9"/><path d="M15.2 6.7c-.4.1-.7.4-.9.8l-1.9 3.6c-.3.5-.2 1.2.3 1.5l2 1.5-1.2 2.9c-.2.5.1 1.1.6 1.3.5.2 1.1-.1 1.3-.6l1.5-3.6c.2-.5 0-1.1-.4-1.4l-1.5-1.1 1.4-2.6 1.9 1.4c.3.2.6.3.9.2l2.6-.7c.5-.1.8-.7.7-1.2-.1-.5-.7-.8-1.2-.7l-2.1.6-2.2-1.6c-.5-.4-1.2-.5-1.8-.3z"/><path fill-rule="evenodd" d="M5 12.6c-2.4 0-4.4 2-4.4 4.4S2.6 21.4 5 21.4s4.4-2 4.4-4.4S7.4 12.6 5 12.6zm0 6.4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/><path fill-rule="evenodd" d="M19 12.6c-2.4 0-4.4 2-4.4 4.4s2 4.4 4.4 4.4 4.4-2 4.4-4.4-2-4.4-4.4-4.4zm0 6.4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="16.5" cy="3.5" r="2"/><path d="M14.9 6.5c-.4 0-.7.1-.9.4l-2.9 3c-.5.5-.5 1.2-.1 1.7l2 2.5-2 3.1-3.4 2c-.6.3-.7 1.1-.4 1.7.3.6 1.1.7 1.7.4l4.1-2.4c.3-.2.5-.4.7-.7l1.6-2.5 1.3-.1 1.4 3.9c.2.6.9.9 1.5.7.6-.2.9-.9.7-1.5l-1.7-4.7c-.2-.5-.7-.9-1.3-.9l-2.1.2-1.1-1.4 1.6-1.7 1.9.8c.3.1.7.1 1 0l2.6-1c.6-.2.9-.9.6-1.5-.2-.6-.9-.9-1.5-.6l-2.1.8-1.8-.7c-.5-.2-.9-.2-1.4-.1z"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="4.4" r="2"/><path d="M12 7c-1 0-1.8.8-1.8 1.8 0 .8.5 1.4 1.2 1.7-.9.2-1.7.6-2.5 1.2L4.4 9.9c-.5-.3-1.2-.1-1.5.4-.3.5-.1 1.2.4 1.5l3.5 2c-.5.9-.8 1.9-.8 3 0 .5.4.9.9.9h10.2c.5 0 .9-.4.9-.9 0-1.1-.3-2.1-.8-3l3.5-2c.5-.3.7-1 .4-1.5-.3-.5-1-.7-1.5-.4l-4.5 2.6c-.8-.6-1.6-1-2.5-1.2.7-.3 1.2-.9 1.2-1.7 0-1-.8-1.8-1.8-1.8z"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="3.8" r="1.9"/><path d="M12 5.7c-.6 0-1.1.5-1.1 1.1v1.3c0 .5-.4.9-.8 1l-2.5.7c-.6.2-1 .8-.8 1.4.1.5.6.9 1.1.9h.2l2-.6v1.7l-2.4 2.3c-.5.4-.5 1.2 0 1.6.2.2.5.3.8.3s.6-.1.8-.3l2.1-2 2.1 2c.5.4 1.2.4 1.6 0 .4-.5.4-1.2 0-1.6l-2.4-2.3v-1.7l2 .6h.2c.5 0 1-.3 1.1-.9.2-.6-.2-1.2-.8-1.4l-2.5-.7c-.4-.1-.8-.5-.8-1v-1.3c0-.6-.5-1.1-1.1-1.1z"/><path d="M9.3 11.4 7.2 10c-.5-.3-1.2-.2-1.5.3-.3.5-.2 1.2.3 1.5l2.1 1.4.6-.7zM14.7 11.4l2.1-1.4c.5-.3 1.2-.2 1.5.3.3.5.2 1.2-.3 1.5l-2.1 1.4-.6-.7z"/></svg>
  </div>

  <p class="note">Ausgewählt: <span id="selInfo">–</span></p>
</div>
<script>
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>{
      document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      document.getElementById('selInfo').textContent=c.getAttribute('data-id');
    });
  });
</script>
</body>
</html>
